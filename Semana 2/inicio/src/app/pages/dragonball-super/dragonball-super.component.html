<h1>Dragonball page</h1>
<hr/>

<section  class="row">
  <div class="col-12 col-md-6">
    <h3>Agregar: {{ name() }}</h3>
    <input type="text"
           #txtName
           class="form-control"
           placeholder="Nombre"
           [value]="name()"
           (input)="name.set(txtName.value)"
    >
    <h3>Agregar: {{ power() }}</h3>
    <input type="number"
           #txtPower
           class="form-control"
           placeholder="poder"
           [value]="power()"
           (input)="power.set(+txtPower.value || 0)"
    >
    <button class="mt-2 btn btn-primary" (click)="addCharacter()">Guardar</button>
  </div>

  <div class="col-12 col-md-6">
    <dragonball-character-list [characters]="characters()"/>
  </div>
</section>
